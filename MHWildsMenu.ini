[Rainmeter]
Update=1000
; resize the window to the visible meters every update, so it shrinks when menus close
DynamicWindowSize=1
; Everything starts closed. Menu.lua owns all menu state (see @Resources\Scripts\Menu.lua).
OnRefreshAction=[!CommandMeasure MenuScript "Reset()"]

; Include order is draw order: the last file included is drawn on top of the rest.
; Paths are anchored with #@# (the @Resources folder) so that files can include
; other files, which is how MainMenu.inc pulls in the eight menus.
@IncludeVariables=#@#Variables.inc
@IncludeStyles=#@#Styles.inc
@IncludeMainMenu=#@#Menus\MainMenu.inc
@IncludeFileList=#@#Panels\FileList.inc
@IncludeNowPlaying=#@#Panels\NowPlaying.inc
@IncludeStatus=#@#Panels\Status.inc
@IncludeRun=#@#Panels\Run.inc
@IncludeCursor=#@#Cursor.inc

[Metadata]
Name=Monster Hunter Wilds Camp Hub
Author=Graytr
Information=A skin created to make your desktop feel like you're relaxing at camp after a long hunt.
Version=2.0.0
License=None

[MenuScript]
Measure=Script
ScriptFile=#@#Scripts\Menu.lua
